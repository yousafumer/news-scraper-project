name: Scrape Articles

on:
  schedule:
    - cron: '0 3,15 * * *'  # Runs at 8AM & 8PM Pakistan Time (UTC+5)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Get code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install required packages
      - name: Install dependencies
        run: |
          pip install feedparser beautifulsoup4 requests pandas

      # Step 4: Run scraper
      - name: Run Scraper
        run: python articles_scraper.py

      # Step 5: Basic JSON check
      - name: Check JSON File
        run: |
          # Simple file checks
          if [ ! -f "all_articles.json" ]; then
            echo "❌ Error: JSON file not found!"
            exit 1
          fi
          
          if [ $(wc -c <"all_articles.json") -lt 100 ]; then
            echo "❌ Error: JSON file too small!"
            exit 1
          fi

      # Step 6: Save results
      - name: Save Articles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Scraper Bot"
          git config user.email "bot@noreply.github.com"
          
          git add all_articles.json
          
          if git diff-index --quiet HEAD --; then
            echo "✅ No new articles"
          else
            git commit -m "📰 Auto-update: $(date +'%Y-%m-%d %H:%M')"
            git pull
            git push origin main
            echo "🚀 Pushed new articles!"
          fi