name: Scrape Articles

on:
  schedule:
    - cron: '0 3,15 * * *'  # Runs at 8AM & 8PM Pakistan Time (UTC+5)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevents hanging workflows

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history

      # Step 2: Setup Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests pandas
          pip list

      # Step 4: Run scraper
      - name: Run Scraper
        run: python articles_scraper.py

      # Step 5: Validate JSON structure
      - name: Validate JSON Integrity
        run: |
          echo "Validating JSON structure..."
          python -c "import json, sys; \
            f = open('all_articles.json'); \
            data = json.load(f); \
            assert isinstance(data, list), 'Top-level must be list'; \
            assert len(data) > 0, 'Empty dataset'; \
            sample = data[0]; \
            assert 'title' in sample, 'Missing title'; \
            assert 'article' in sample, 'Missing content'; \
            assert 'published_date' in sample, 'Missing date'; \
            print(f'✅ Validation passed: {len(data)} articles')"

      # Step 6: Commit and push changes
      - name: Commit & Push Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "AI-Smart-Press-Bot"
          git config --global user.email "ai-smart-press@noreply.github.com"
          
          # Add only JSON file
          git add all_articles.json
          
          # Check for changes before committing
          if git diff-index --quiet HEAD --; then
            echo "🟢 No changes detected"
          else
            git commit -m "📰 Auto-update: $(date +'%d %b %Y %H:%M %Z')"
            git pull --rebase  # Prevent merge conflicts
            git push origin main
            echo "🚀 Pushed new articles!"
          fi

      # Step 7: Clean up (optional)
      - name: Clean Workspace
        if: always()  # Runs even if previous steps fail
        run: |
          echo "Cleaning temporary files..."
          rm -rf .tmp_*

    # Failure notification
      - name: Notify on Failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
         script: |
           const { repo, owner } = context.repo;
           github.rest.issues.createComment({
             issue_number: 1,
             owner,
             repo,
             body: `❌ Scraping failed! [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
          });